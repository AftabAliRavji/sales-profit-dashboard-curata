version: "3.9"

services:
  curata-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curata-dashboard
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ENABLECORS: "false"
      STREAMLIT_SERVER_ENABLEXSRSFPROTECTION: "false"
    volumes:
      - .:/app
    restart: unless-stopped
